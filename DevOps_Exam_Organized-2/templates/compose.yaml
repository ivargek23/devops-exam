services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    image: YOUR_IMAGE
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: password

volumes:
  dbdata:
